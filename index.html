<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEO-SYNTH // CORE_01</title>
<style>
  :root {
    --neon: #00ffcc;
    --neon-dim: rgba(0, 255, 204, 0.2);
    --alert: #ff0055;
    --bg: #05080c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background: var(--bg);
    color: var(--neon);
    font-family: "Courier New", Courier, monospace;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* Matrix rain background */
  canvas#bg-canvas {
    position: absolute;
    inset: 0;
    z-index: 1;
    opacity: 0.35;
  }

  /* CRT Scanline Overlay */
  .crt::after {
    content: " ";
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%),
                linear-gradient(90deg, rgba(255,0,0,0.03), rgba(0,255,0,0.01), rgba(0,0,255,0.03));
    background-size: 100% 3px, 6px 100%;
    z-index: 10;
    pointer-events: none;
  }

  /* Glassmorphism Panel */
  .panel {
    position: relative;
    z-index: 5;
    background: rgba(8, 16, 24, 0.85);
    border: 1px solid var(--neon);
    box-shadow: 0 0 25px var(--neon-dim), inset 0 0 15px rgba(0,255,204,0.05);
    padding: 30px;
    width: 480px;
    border-radius: 4px;
    backdrop-filter: blur(8px);
  }

  .header {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid var(--neon);
    padding-bottom: 8px;
    margin-bottom: 20px;
    letter-spacing: 2px;
  }

  canvas#scope {
    width: 100%;
    height: 100px;
    background: #020406;
    border: 1px solid var(--neon-dim);
    margin-bottom: 20px;
    display: block;
  }

  .control-group {
    margin-bottom: 18px;
  }

  label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    letter-spacing: 1px;
    margin-bottom: 5px;
  }

  input[type="range"] {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    background: #0a1820;
    outline: none;
    border: 1px solid var(--neon-dim);
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    background: var(--neon);
    cursor: pointer;
    box-shadow: 0 0 8px var(--neon);
  }

  button#power {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1px solid var(--neon);
    color: var(--neon);
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: 0.2s all;
  }

  button#power:hover {
    background: var(--neon);
    color: #000;
    box-shadow: 0 0 20px var(--neon);
  }

  button#power.active {
    border-color: var(--alert);
    color: var(--alert);
  }

  button#power.active:hover {
    background: var(--alert);
    color: #fff;
    box-shadow: 0 0 20px var(--alert);
  }
</style>
</head>
<body class="crt">

<canvas id="bg-canvas"></canvas>

<div class="panel">
  <div class="header">
    <span>SYSTEM: ONLINE</span>
    <span>FREQ_MOD // V.02</span>
  </div>

  <canvas id="scope"></canvas>

  <div class="control-group">
    <label><span>CARRIER FREQ</span><span id="carrier-val">65 Hz</span></label>
    <input type="range" id="carrier" min="30" max="220" value="65">
  </div>

  <div class="control-group">
    <label><span>MOD RESONANCE</span><span id="res-val">2.5 Hz</span></label>
    <input type="range" id="mod" min="0.1" max="15" step="0.1" value="2.5">
  </div>

  <div class="control-group">
    <label><span>FILTER CUTOFF</span><span id="cut-val">400 Hz</span></label>
    <input type="range" id="cutoff" min="100" max="3000" value="400">
  </div>

  <button id="power">ENGAGE CORE AUDIO</button>
</div>

<script>
  // --- BACKGROUND MATRIX RAIN ---
  const bg = document.getElementById('bg-canvas');
  const btx = bg.getContext('2d');
  let w = bg.width = window.innerWidth;
  let h = bg.height = window.innerHeight;

  const chars = '0123456789ABCDEFｦｱｳｴｵｶｷｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈ';
  const fontSize = 14;
  const columns = Math.floor(w / fontSize);
  const drops = Array(columns).fill(1);

  window.onresize = () => {
    w = bg.width = window.innerWidth;
    h = bg.height = window.innerHeight;
  };

  function drawMatrix() {
    btx.fillStyle = 'rgba(5, 8, 12, 0.15)';
    btx.fillRect(0, 0, w, h);
    btx.fillStyle = '#00ffcc';
    btx.font = fontSize + 'px monospace';

    for (let i = 0; i < drops.length; i++) {
      const text = chars[Math.floor(Math.random() * chars.length)];
      btx.fillText(text, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > h && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
    requestAnimationFrame(drawMatrix);
  }
  drawMatrix();

  // --- AUDIO SYNTH ENGINE ---
  let audioCtx, osc1, osc2, modOsc, modGain, filter, analyser, dataArray;
  let running = false;

  const btn = document.getElementById('power');
  const carrierSlider = document.getElementById('carrier');
  const modSlider = document.getElementById('mod');
  const cutoffSlider = document.getElementById('cutoff');

  function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    // Nodes
    osc1 = audioCtx.createOscillator();
    osc2 = audioCtx.createOscillator();
    modOsc = audioCtx.createOscillator();
    modGain = audioCtx.createGain();
    filter = audioCtx.createBiquadFilter();
    analyser = audioCtx.createAnalyser();

    // Config
    osc1.type = 'sawtooth';
    osc2.type = 'square';
    modOsc.type = 'sine';

    filter.type = 'lowpass';
    filter.Q.value = 8;

    analyser.fftSize = 512;
    dataArray = new Uint8Array(analyser.frequencyBinCount);

    // Patch bay
    modOsc.connect(modGain);
    modGain.connect(osc1.frequency);
    
    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(analyser);
    analyser.connect(audioCtx.destination);

    // Initial values
    updateParams();

    osc1.start();
    osc2.start();
    modOsc.start();
  }

  function updateParams() {
    if (!audioCtx) return;
    const baseFreq = parseFloat(carrierSlider.value);
    osc1.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
    osc2.frequency.setValueAtTime(baseFreq * 1.5, audioCtx.currentTime); // Perfect fifth harmony
    
    modOsc.frequency.setValueAtTime(parseFloat(modSlider.value), audioCtx.currentTime);
    modGain.gain.setValueAtTime(baseFreq * 0.4, audioCtx.currentTime);

    filter.frequency.setValueAtTime(parseFloat(cutoffSlider.value), audioCtx.currentTime);

    document.getElementById('carrier-val').innerText = carrierSlider.value + ' Hz';
    document.getElementById('res-val').innerText = modSlider.value + ' Hz';
    document.getElementById('cut-val').innerText = cutoffSlider.value + ' Hz';
  }

  [carrierSlider, modSlider, cutoffSlider].forEach(s => s.addEventListener('input', updateParams));

  btn.onclick = async () => {
    if (!running) {
      if (!audioCtx) initAudio();
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      running = true;
      btn.innerText = "TERMINATE OVERRIDE";
      btn.classList.add('active');
      drawOscilloscope();
    } else {
      audioCtx.suspend();
      running = false;
      btn.innerText = "ENGAGE CORE AUDIO";
      btn.classList.remove('active');
    }
  };

  // --- OSCILLOSCOPE MONITOR ---
  const scope = document.getElementById('scope');
  const stx = scope.getContext('2d');

  function drawOscilloscope() {
    if (!running) return;
    requestAnimationFrame(drawOscilloscope);

    analyser.getByteTimeDomainData(dataArray);

    stx.fillStyle = '#020406';
    stx.fillRect(0, 0, scope.width, scope.height);

    stx.lineWidth = 1.5;
    stx.strokeStyle = '#00ffcc';
    stx.beginPath();

    const sliceWidth = scope.width * 1.0 / dataArray.length;
    let x = 0;

    for (let i = 0; i < dataArray.length; i++) {
      const v = dataArray[i] / 128.0;
      const y = v * (scope.height / 2);

      if (i === 0) stx.moveTo(x, y);
      else stx.lineTo(x, y);

      x += sliceWidth;
    }

    stx.stroke();
  }
</script>
</body>
</html>
